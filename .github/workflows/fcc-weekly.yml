name: FCC Weekly Report

on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev libxkbcommon-dev libglib2.0-0 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2

      - name: Install dependencies
        run: npm install puppeteer nodemailer

      - name: Send FCC weekly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: tliao@netgear.com
        run: node scripts/fcc-weekly.js
