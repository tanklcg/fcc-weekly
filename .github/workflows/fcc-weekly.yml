name: FCC Weekly Report

on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install node-fetch cheerio nodemailer

      - name: Send FCC weekly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: tliao@netgear.com
        run: node scripts/fcc-weekly.js
